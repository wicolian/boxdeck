version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      root-go-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: /cmd/boxdeck-bar
    schedule:
      interval: weekly
    groups:
      bar-go-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    groups:
      android-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: swift
    directory: /apple/BoxdeckKit
    schedule:
      interval: weekly
    groups:
      boxdeck-kit-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # The root Package.swift builds macos/BoxdeckBar.
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
    groups:
      macos-bar-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
