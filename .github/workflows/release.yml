name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-server:
    # ubuntu-latest is Ubuntu 24.04, verified 2026-09-18.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # v7.0.1 released 2026-07-20, verified 2026-09-18.
      - uses: actions/setup-go@v7 # v7.0.0 released 2026-07-16, verified 2026-09-18.
        with:
          go-version-file: go.mod
          cache: false
      - run: go vet ./... && go test ./...
      - run: make release VERSION="$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v7 # v7.0.1 released 2026-04-10, verified 2026-09-18.
        with:
          name: server-assets
          path: dist/boxdeck_*

  build-bar:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            asset: boxdeck-bar_linux_amd64
            ldflags: -s -w
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            asset: boxdeck-bar_linux_arm64
            ldflags: -s -w
          - os: ubuntu-latest
            goos: windows
            goarch: amd64
            asset: boxdeck-bar_windows_amd64.exe
            ldflags: -s -w -H=windowsgui
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7 # v7.0.1 released 2026-07-20, verified 2026-09-18.
      - uses: actions/setup-go@v7 # v7.0.0 released 2026-07-16, verified 2026-09-18.
        with:
          go-version-file: go.mod
          cache: false
      - run: go -C cmd/boxdeck-bar test ./...
      - name: Build bar
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: mkdir -p dist && go -C cmd/boxdeck-bar build -trimpath -ldflags="${{ matrix.ldflags }}" -o "../../dist/${{ matrix.asset }}" .
      - uses: actions/upload-artifact@v7 # v7.0.1 released 2026-04-10, verified 2026-09-18.
        with:
          name: bar-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/${{ matrix.asset }}

  build-bar-macos:
    # macos-latest is macOS 26 arm64 with Xcode 26.6 by default, verified 2026-09-18.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7 # v7.0.1 released 2026-07-20, verified 2026-09-18.
      - name: Verify Apple toolchain
        run: |
          xcode-select -p
          xcodebuild -version
      - name: Run Swift tests
        run: swift test
      - name: Build universal Swift bar app
        shell: bash
        run: |
          set -euo pipefail
          swift build -c release --arch arm64
          swift build -c release --arch x86_64
          mkdir -p dist
          lipo -create .build/arm64-apple-macosx/release/BoxdeckBar .build/x86_64-apple-macosx/release/BoxdeckBar -output "$RUNNER_TEMP/BoxdeckBar"
          packaging/macos/build.sh "$RUNNER_TEMP/BoxdeckBar" "$RUNNER_TEMP/BoxdeckBar.app" "${GITHUB_REF_NAME#v}"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/BoxdeckBar.app" dist/boxdeck-bar_darwin_universal.zip
      - uses: actions/upload-artifact@v7 # v7.0.1 released 2026-04-10, verified 2026-09-18.
        with:
          name: bar-darwin-universal
          path: dist/boxdeck-bar_darwin_universal.zip

  publish:
    if: github.event_name != 'workflow_dispatch'
    needs: [build-server, build-bar, build-bar-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # v7.0.1 released 2026-07-20, verified 2026-09-18.
      - uses: actions/download-artifact@v8 # v8.0.1 released 2026-03-11, verified 2026-09-18.
        with:
          path: dist
          merge-multiple: true
      - name: Publish binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
