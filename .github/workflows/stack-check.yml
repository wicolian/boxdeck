name: Stack check

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # ubuntu-latest is Ubuntu 24.04, verified 2026-09-18.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # v7.0.1 released 2026-07-20, verified 2026-09-18.
      - name: Check stack majors
        run: scripts/stack-check.sh
